name: github pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"

      - name: Build
        run: hugo --minify

      - name: Clean artifact for deployment
        run: |
          # Remove symlinks and hard links
          find ./public -type l -delete
          find ./public -type f -links +1 -delete
          # List remaining suspects before upload
          echo "Checking for lingering symlinks/hardlinks:"
          if find ./public -type l | grep -q .; then
            echo "ERROR: Symlinks present after cleanup!"
            find ./public -type l
            exit 1
          fi
          if find ./public -type f -links +1 | grep -q .; then
            echo "ERROR: Hardlinks present after cleanup!"
            find ./public -type f -links +1
            exit 1
          fi
          echo "OK: No symlinks or hardlinks found."

      - name: Check artifact size before upload
        run: |
          ARTIFACT_SIZE=$(du -sh ./public | cut -f1)
          echo "Artifact size is $ARTIFACT_SIZE"
          FILE_COUNT=$(find ./public | wc -l)
          echo "Total files: $FILE_COUNT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./public
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
